    <h1>工具说明</h1>
    <p>本机页签核对是一款在 Windows 本机运行的个人只读工具。它通过 Google Sheets API 核对用户已指定、且其 Google 账号有权查看的表格页签，确认页签是否存在、名称和顺序是否符合预期。</p>
    <p>用户本人在 Google 页面授权。工具只用这项授权读取页签属性，不读取单元格、不修改表格。核对在本机完成，不向维护者或第三方上传或分享表格数据。本网站仅提供说明，不提供登录、上传或在线核对功能。</p>
